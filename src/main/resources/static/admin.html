<!DOCTYPE html>
<html lang="zh-CN">
<a href="index.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium">
    返回背词前台 →
</a>
<head>
    <meta charset="UTF-8">
    <title>本地墨墨 - 词库管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-100 p-6">
<div id="admin-app" class="max-w-5xl mx-auto bg-white rounded-2xl shadow p-6">
    <div class="flex justify-between items-center border-b pb-4 mb-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">⚙️ 词库数据后台管理</h1>
            <p class="text-sm text-slate-400 mt-0.5">直接操控和审查本地真实持久化 JSON 数据流</p>
        </div>
        <div class="flex space-x-2">
            <a href="import.html" class="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl text-sm font-medium">📥 批量导入词汇集</a>
            <a href="word-bombing.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium">返回背词前台 →</a>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-slate-50 p-5 rounded-2xl border h-fit space-y-4">
            <h3 class="font-bold text-slate-700">✍️ 单条录入新词</h3>
            <div class="space-y-3 text-sm">
                <input v-model="form.word" type="text" placeholder="单词 (如: abstract)" class="w-full p-2.5 border rounded-xl outline-none">
                <input v-model="form.phonetic" type="text" placeholder="音标 (如: ˈæbstrækt)" class="w-full p-2.5 border rounded-xl outline-none">
                <input v-model="form.definition" type="text" placeholder="核心释义" class="w-full p-2.5 border rounded-xl outline-none">
                <textarea v-model="form.example" placeholder="经典例句" rows="2" class="w-full p-2.5 border rounded-xl outline-none"></textarea>
                <select v-model="form.category" class="w-full p-2.5 border rounded-xl bg-white outline-none">
                    <option value="中考">👦 中考必刷词</option>
                    <option value="高考">🧑 高考冲刺词</option>
                    <option value="考研">🎓 考研高频词</option>
                </select>
                <button @click="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-sm">录入服务器</button>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-4">
            <div class="flex space-x-2 bg-slate-100 p-1 rounded-xl w-fit text-sm">
                <button v-for="t in ['全部', '中考', '高考', '考研']" @click="tab = t" :class="['px-4 py-2 rounded-lg font-bold transition', tab === t ? 'bg-white text-indigo-600 shadow-sm':'text-slate-500']">{{t}}</button>
            </div>

            <div class="border rounded-2xl overflow-hidden bg-white">
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                    <tr class="bg-slate-50 border-b text-slate-400 text-xs font-bold">
                        <th class="p-3 pl-5">单词信息</th>
                        <th class="p-3">词书分类</th>
                        <th class="p-3">核心释义及例句</th>
                        <th class="p-3 text-center">操作</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y text-slate-700">
                    <tr v-for="w in filtered" :key="w.id" class="hover:bg-slate-50/50 transition">
                        <td class="p-3 pl-5"><strong class="text-slate-900 text-base">{{w.word}}</strong><p class="text-xs text-slate-400">/{{w.phonetic}}/</p></td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-xs font-bold bg-indigo-50 text-indigo-600">{{w.category}}</span></td>
                        <td class="p-3 max-w-xs"><div class="truncate font-medium">{{w.definition}}</div><div class="text-xs text-slate-400 italic truncate mt-0.5">{{w.example}}</div></td>
                        <td class="p-3 text-center"><button @click="remove(w.id)" class="text-xs font-bold text-red-500 hover:bg-red-50 px-2.5 py-1.5 rounded-lg border border-red-100 transition">删除</button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, computed, onMounted } = Vue;
    createApp({
        setup() {
            const list = ref([]); const tab = ref('全部');
            const form = ref({ word:'', phonetic:'', definition:'', example:'', category:'中考' });

            const load = async () => { const res = await fetch('/api/words'); list.value = await res.json(); };
            onMounted(load);

            const filtered = computed(() => tab.value === '全部' ? list.value : list.value.filter(w => w.category === tab.value));

            async function submit() {
                if(!form.value.word || !form.value.definition) return alert("请补全单词与释义！");
                const res = await fetch('/api/words', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(form.value) });
                if((await res.json()).status === 'success') { load(); form.value = { word:'', phonetic:'', definition:'', example:'', category:form.value.category }; }
            }

            async function remove(id) {
                if(!confirm("确定要删除吗？")) return;
                const res = await fetch(`/api/words/${id}`, { method:'DELETE' });
                if((await res.json()).status === 'success') load();
            }

            return { list, tab, form, filtered, submit, remove };
        }
    }).mount('#admin-app');
</script>
</body>
</html>
